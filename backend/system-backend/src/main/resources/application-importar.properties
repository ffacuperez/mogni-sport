# Importación de alumnos desde una planilla (ver ImportacionAlumnos): corre, revisa o importa, y termina.
# En el servidor, junto con "prod":
#   docker compose run --rm -v ~/alumnos.tsv:/importacion/alumnos.tsv:ro \
#     -e SPRING_PROFILES_ACTIVE=prod,importar -e APP_IMPORTACION_ARCHIVO=/importacion/alumnos.tsv backend
# Primero así (solo revisa); para guardar, agregar -e APP_IMPORTACION_CONFIRMAR=true.
# Puerto al azar: no choca con el back que está corriendo.
server.port=0
app.importacion.confirmar=false

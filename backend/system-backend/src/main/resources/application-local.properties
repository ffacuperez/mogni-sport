# Perfil para desarrollar en la compu. La base y las claves salen del .env (ver application.properties y .env.example).
# La conexión está acá y en el perfil prod, nunca en application.properties: los tests usan su base embebida solo si
# nadie más define la URL. Si estuviera allá, tomarían DB_URL del .env y recrearían las tablas de esa base.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Solo en local: el SQL de Hibernate en la consola, para depurar
spring.jpa.show-sql=true
# Swagger UI y /v3/api-docs solo en local
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# La cookie de sesión sin exigir HTTPS: en la compu el back corre en http://localhost
app.sesion.cookie-segura=false

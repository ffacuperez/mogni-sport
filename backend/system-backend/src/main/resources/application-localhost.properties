# Perfil para probar en la compu, sin Neon ni Railway. Se usa SIEMPRE junto con "local" (de ahí salen el JWT y las
# claves push), y como va después, la base de este archivo reemplaza a la de Neon:
#   1.a vez (crea las tablas y carga data.sql):  ./mvnw spring-boot:run -Dspring-boot.run.profiles=local,localhost,seed
#   después:                                     ./mvnw spring-boot:run -Dspring-boot.run.profiles=local,localhost
# Base: el Postgres de docker-compose.yml (docker compose up -d). Se puede cambiar con DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mogni}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:mogni}

# HU-262: al arrancar crea turnos de hoy y de ayer con reservas para probar la asistencia (ver DatosDemoAsistencia)
app.demo.asistencia=true

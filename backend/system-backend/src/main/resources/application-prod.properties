# Perfil del servidor (Hetzner, docker-compose.yml). Todas las variables las pone docker-compose desde su .env.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false

# Detrás de Caddy: toma el protocolo, el host y el puerto originales de los X-Forwarded-*. Así el front, que está en
# el mismo dominio, cuenta como mismo origen y no hace falta agregarlo al CORS.
server.forward-headers-strategy=native
server.tomcat.remoteip.port-header=X-Forwarded-Port

# Al reiniciar el contenedor deja terminar los pedidos en curso
server.shutdown=graceful

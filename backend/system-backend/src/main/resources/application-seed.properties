# Perfil que BORRA toda la base y carga los datos de prueba de data.sql.
# Uso (una sola vez): ./mvnw spring-boot:run -Dspring-boot.run.profiles=local,seed
# Después volver a levantar sin "seed"; si no, cada arranque borra todo de nuevo.

# Recrea las tablas desde las entidades, así el esquema queda igual al modelo
# (sin columnas viejas como alumnos.membresia_id, celular, precio, etc.)
spring.jpa.hibernate.ddl-auto=create
spring.sql.init.mode=always
# Ejecutar data.sql después de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true

spring.application.name=system-backend

# En la compu se usa "local"; en el servidor, docker-compose.yml lo cambia con SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=local

# Los secretos nunca van en el repo: salen de variables de entorno. En la compu, de un archivo .env en esta carpeta
# (backend/system-backend/.env, copiado de .env.example); en el servidor, del .env de docker-compose.
spring.config.import=optional:file:.env[.properties]

spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Notificaciones push (HU-250): claves VAPID del servidor. Si se cambian, los dispositivos tienen que volver a activar las notificaciones
push.vapid.public-key=${VAPID_PUBLIC_KEY:}
push.vapid.private-key=${VAPID_PRIVATE_KEY:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Las colecciones perezosas (semanas -> sesiones -> ejercicios de un plan) se traen de a tandas de hasta 50 en una
# sola consulta, en vez de una consulta por cada semana o sesión. No cambia ningún resultado, solo cuántas consultas
# se hacen.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# El SQL no va a los logs (producción); solo el perfil "local" lo muestra
spring.jpa.show-sql=false

# Mails transaccionales (Recuperar contraseña) con Brevo. La API key y el remitente van SOLO como variables de
# entorno (el .env, igual que los secretos de arriba): nunca se escriben en este archivo.
# Sin API key no se manda el mail y el link queda en el log (sirve para probar en la compu).
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:Mogni System}
# Dirección del frontend, para armar el link del mail de recuperación
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.recuperacion-password.minutos-validez=30

# Swagger (springdoc): apagado salvo en el perfil "local", así la API no queda documentada en público en producción
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

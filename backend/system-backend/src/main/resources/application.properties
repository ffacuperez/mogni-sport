spring.application.name=system-backend

# En la compu se usa "local"; en el servidor, docker-compose.yml lo cambia con SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=local

# Los secretos nunca van en el repo: salen de variables de entorno. En la compu, de un archivo .env en esta carpeta
# (backend/system-backend/.env, copiado de .env.example); en el servidor, del .env de docker-compose.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Notificaciones push (HU-250): claves VAPID del servidor. Si se cambian, los dispositivos tienen que volver a activar las notificaciones
push.vapid.public-key=${VAPID_PUBLIC_KEY:}
push.vapid.private-key=${VAPID_PRIVATE_KEY:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

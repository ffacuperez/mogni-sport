spring.application.name=system-backend

spring.profiles.active=local
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# El SQL no va a los logs (producción); solo el perfil "local" lo muestra
spring.jpa.show-sql=false

# Mails transaccionales (Recuperar contraseña) con Brevo. La API key y el remitente van SOLO como variables de
# entorno (Railway > Variables, o en la terminal para probar en la compu): nunca se escriben en este archivo.
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:Mogni Sport}
# Dirección del frontend, para armar el link del mail de recuperación
app.frontend-url=${FRONTEND_URL:https://mogni-sport-dev.vercel.app}
app.recuperacion-password.minutos-validez=30

# Swagger (springdoc): apagado salvo en el perfil "local", así la API no queda documentada en público en producción
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

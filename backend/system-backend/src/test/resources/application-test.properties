# Perfil de los tests: nunca la base compartida (Neon) del perfil "local". Surefire lo activa para todos los tests
# (ver pom.xml) y cada contexto de Spring recibe una base PostgreSQL embebida y vacía (BaseEmbebidaTestInitializer,
# registrado en META-INF/spring.factories de los tests).
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

jwt.secret=clave-solo-para-las-pruebas-automatizadas-de-mogni
jwt.expiration-ms=3600000

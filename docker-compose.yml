# Mogni Sport completo en un solo servidor: Caddy (front + HTTPS + proxy de /api), backend y PostgreSQL.
# Las variables salen del .env de esta carpeta (copiar .env.example). Levantar con:
#   docker compose up -d --build
name: mogni

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mogni}
      POSTGRES_USER: ${POSTGRES_USER:-mogni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el .env}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      # Postgres 18 guarda los datos en /var/lib/postgresql/18/docker: el volumen va un nivel más arriba
      - pgdata:/var/lib/postgresql
    # Sin "ports": la base solo se ve desde la red interna de Docker, nunca desde internet.
    # Para entrar a mano: docker compose exec db psql -U mogni mogni
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend/system-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mogni}
      DB_USER: ${POSTGRES_USER:-mogni}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el .env}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      # Recuperar contraseña (HU-263): sin API key no se manda el mail y el link queda en el log del back
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    # Tampoco publica puertos: solo le llega lo que Caddy le pasa por /api

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados HTTPS: si se pierden, Caddy los vuelve a pedir (y Let's Encrypt tiene límite de pedidos)
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
